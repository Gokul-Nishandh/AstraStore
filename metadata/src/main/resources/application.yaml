# ============================================================
#  Metadata Service — Configuration
# ============================================================
spring:
  application:
    name: metadata-service

  # PostgreSQL datasource
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/astrastore
    username: ${SPRING_DATASOURCE_USERNAME:astrastore}
    password: ${SPRING_DATASOURCE_PASSWORD:astrastore_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        hbm2ddl:
          create_namespaces: true

  # Kafka producer configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

  # Never let Spring's default whitelabel/servlet error body escape: every
  # failure is rendered by GlobalExceptionHandler as an ApiError envelope.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: 8084
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

# JWT verification — the same signing secret every AstraStore service holds.
# Must match auth/src/main/resources/application.yaml.
jwt:
  secret: ${JWT_SECRET:astrastore_jwt_secret_key_change_in_production_min_256_bits}

astrastore:
  internal:
    # Shared secret guarding /internal/v1/**, which bypasses ownership checks.
    # The same value must be set on upload, download and replication, which
    # present it. Blank is refused at startup unless a dev/local/test profile
    # is active, so a real deployment cannot come up unauthenticated.
    # METADATA_INTERNAL_TOKEN is the superseded name, still honoured.
    service-token: ${ASTRA_INTERNAL_TOKEN:${METADATA_INTERNAL_TOKEN:}}

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

# OTEL / Jaeger
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  service:
    name: ${OTEL_SERVICE_NAME:metadata-service}

logging:
  level:
    com.astrastore: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.kafka: INFO
