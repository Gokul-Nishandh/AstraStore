# ============================================================
#  Metadata Service — Test Profile
#  Uses H2 in-memory DB instead of Postgres.
#  Disables Kafka so context loads without a broker.
# ============================================================
spring:
  application:
    name: metadata-service-test

  # H2 in-memory database for tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Disable Kafka auto-configuration for unit tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # Disable Kafka completely
  kafka:
    bootstrap-servers:

# Disable actuator during tests
management:
  endpoints:
    enabled-by-default: false

# Deterministic signing secret for tests (>= 256 bits, as HS256 requires).
jwt:
  secret: astrastore_test_jwt_secret_key_that_is_long_enough_for_hs256

astrastore:
  internal:
    # Blank on purpose: the open mode is part of what the suite exercises, and
    # the test profile is one of the few where a blank token is permitted.
    # Tests that assert enforcement override this with a non-blank value.
    service-token: ""
