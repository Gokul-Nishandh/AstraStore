// ============================================================
//  metadata — File metadata management service
//
//  Responsibilities:
//    - CRUD for file/object metadata records
//    - Stores filename, size, content-type, owner,
//      storage location, replica count, timestamps
//    - Emits events to Kafka on create/update/delete
// ============================================================
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'jacoco'
}

description = 'AstraStore Metadata Service'

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2023.0.3')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Spring Boot core
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Platform security: AstraPrincipal, JwtTokenVerifier, AstraResourceServerConfig,
    // CurrentUser and the shared ApiError envelope.
    implementation project(':astrastore-shared')
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Lombok — reduces boilerplate (Getter, Builder, etc.)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly    'org.postgresql:postgresql'

    // Kafka producer
    implementation 'org.springframework.kafka:spring-kafka'

    // Micrometer → OpenTelemetry tracing bridge
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'

    // Micrometer Prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
    // H2 in-memory DB for unit/integration tests (Postgres in production)
    testRuntimeOnly    'com.h2database:h2'
}

bootRun {
    args = ['--spring.profiles.active=local']
}

// Coverage (Volume 7, Section 2.2 — NFR-011: >= 70% unit coverage per service)
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.70
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
