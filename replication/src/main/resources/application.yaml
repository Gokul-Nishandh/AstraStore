# ============================================================
#  Replication Service — Configuration
# ============================================================
spring:
  application:
    name: replication-service

  # Kafka consumer + producer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: replication-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.astrastore.shared.events"
        spring.json.value.default.type: com.astrastore.shared.events.ChunkWrittenEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

server:
  port: 8086

services:
  metadata-url: ${SERVICES_METADATA_URL:http://metadata:8084}

astrastore:
  # Copies kept per chunk, counting the primary. Must match the value the
  # placement service uses to report capacity, or the logical-bytes estimate
  # on the dashboard will disagree with what is actually on disk.
  replication-factor: ${ASTRASTORE_REPLICATION_FACTOR:2}
  internal:
    # Shared secret presented to metadata's /internal/v1/** surface, which
    # bypasses ownership checks. Must match the value metadata is given.
    # Blank is refused at startup unless a dev/local/test profile is active,
    # so a real deployment cannot come up unauthenticated.
    service-token: ${ASTRA_INTERNAL_TOKEN:}
  placement:
    url: ${PLACEMENT_SERVICE_URL:http://placement:8085}

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

# OTEL / Jaeger
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  service:
    name: ${OTEL_SERVICE_NAME:replication-service}

logging:
  level:
    com.astrastore: DEBUG
    org.springframework.kafka: INFO

