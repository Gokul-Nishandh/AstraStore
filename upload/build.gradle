// ============================================================
//  upload — File upload / ingestion service
//
//  Responsibilities:
//    - Accept multipart file uploads (up to 5 GB)
//    - Forward file to placement service for storage decision
//    - Produce upload events to Kafka
// ============================================================
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'jacoco'
}

description = 'AstraStore Upload Service'

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2023.0.3')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Kafka producer
    implementation 'org.springframework.kafka:spring-kafka'

    // Micrometer → OpenTelemetry tracing bridge
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'

    // Micrometer Prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Shared module
    implementation project(':astrastore-shared')

    // Lombok — reduces boilerplate (Getter, Builder, etc.)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

bootRun {
    args = ['--spring.profiles.active=local']
}

// Coverage (Volume 7, Section 2.2 — NFR-011: >= 70% unit coverage per service)
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.70
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
