# ============================================================
#  Storage Node Service — Configuration
# ============================================================
spring:
  application:
    name: storage-node

server:
  port: 8088

# ============================================================
#  Node identity and quota
#  docker-compose sets STORAGE_NODE_ID and STORAGE_CAPACITY_BYTES
#  per container. capacity-bytes is the node's *allowance*, not the
#  host disk: three containers share one physical drive locally, so
#  the filesystem's size is not a per-node number and must never be
#  summed across the cluster.
# ============================================================
astrastore:
  node:
    id: ${STORAGE_NODE_ID:storage-node}
    capacity-bytes: ${STORAGE_CAPACITY_BYTES:21474836480}
    storage-root: ${STORAGE_ROOT:/data/storage}
    # Full re-walk interval for the running usage counter (ms).
    usage-reconcile-interval-ms: ${STORAGE_USAGE_RECONCILE_INTERVAL_MS:300000}

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

# OTEL / Jaeger
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  service:
    name: ${OTEL_SERVICE_NAME:storage-node}

logging:
  level:
    com.astrastore: DEBUG
