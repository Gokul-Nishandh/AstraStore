# ============================================================
#  Auth Service — Test Profile
#  Uses H2 in-memory DB instead of Postgres.
#  Disables Redis and Kafka so context loads without them.
# ============================================================
spring:
  application:
    name: auth-service-test

  # H2 in-memory database for tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Disable Redis auto-configuration for unit tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # Disable Kafka completely
  kafka:
    bootstrap-servers:

# JWT test secret
jwt:
  secret: test_jwt_secret_key_at_least_256_bits_for_hs256_algorithm_test
  expiration-ms: 3600000

# Disable actuator during tests
management:
  endpoints:
    enabled-by-default: false
