// ============================================================
//  auth — Authentication & authorisation service
//
//  Responsibilities:
//    - User registration & login
//    - JWT token generation & validation
//    - Role-based access control
//    - Redis-backed session / token cache
// ============================================================
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'AstraStore Auth Service'

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2023.0.3')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Shared contracts: ApiError (the single error envelope), AstraPrincipal
    // (role names) and JwtTokenVerifier (used in tests to prove the access
    // tokens this service issues are readable by every other service).
    implementation project(':astrastore-shared')

    // Spring Boot core
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Federated sign-in (Google, GitHub). Optional at runtime: with no client
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok — reduces boilerplate (Getter, Builder, etc.)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly    'org.postgresql:postgresql'

    // Redis (session / token cache)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JWT — kept in lockstep with astrastore-shared so the api/impl pair on the
    // runtime classpath is a single consistent version.
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Micrometer → OpenTelemetry tracing bridge (OTEL Java agent handles the rest)
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'

    // Micrometer Prometheus (shared across all services)
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    testRuntimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'
    // H2 in-memory DB for unit/integration tests (Postgres in production)
    testRuntimeOnly    'com.h2database:h2'
}

bootRun {
    args = ['--spring.profiles.active=local']
}
