// ============================================================
//  astrastore-shared — Shared contracts and interfaces
//
//  Responsibilities:
//    - Data records (ChunkManifest, ObjectManifest)
//    - Strategy interfaces (PlacementStrategy, StorageStreamClient)
//    - Shared across Upload, Download, Replication services
// ============================================================
plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

description = 'AstraStore Shared Module'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.withType(Test) {
    useJUnitPlatform()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.3.5'
    }
}

dependencies {
    // Lombok — reduces boilerplate (Getter, Builder, etc.)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- Shared security -------------------------------------------------
    // Token parsing is `api` because AstraPrincipal/JwtTokenVerifier are part
    // of this module's public surface and every consuming service needs them
    // at runtime.
    api 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Spring is compileOnly on purpose: the Spring-dependent classes
    // (the filter and the resource-server config) are only loaded by
    // services, which bring their own Spring Boot starters. Keeping these
    // off the runtime classpath means the CLI and SDK can depend on this
    // module without dragging a web framework in with them.
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'com.fasterxml.jackson.core:jackson-databind'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}
