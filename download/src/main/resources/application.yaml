# ============================================================
#  Download Service — Configuration
# ============================================================
spring:
  application:
    name: download-service

server:
  port: 8083

# Downstream service endpoints
services:
  metadata-url: ${SERVICES_METADATA_URL:http://localhost:8084}

# Download Service tuning (Volume 2, Section 6.4)
download:
  fetch-parallelism: 4
  fallback-timeout-ms: 3000
  stream-buffer-kb: 256

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

# OTEL / Jaeger
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  service:
    name: ${OTEL_SERVICE_NAME:download-service}

logging:
  level:
    com.astrastore: DEBUG

astrastore:
  internal:
    # Shared secret presented to metadata's /internal/v1/** surface, which
    # bypasses ownership checks. Must match the value metadata is given.
    # Blank is refused at startup unless a dev/local/test profile is active,
    # so a real deployment cannot come up unauthenticated.
    service-token: ${ASTRA_INTERNAL_TOKEN:}
