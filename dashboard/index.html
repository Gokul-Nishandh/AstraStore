<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <title>AstraStore — Distributed object storage</title>
    <meta
      name="description"
      content="AstraStore is a distributed object storage platform. Chunked writes, checksum-verified reads, self-healing replication, and a live view of every node in the cluster."
    />
    <meta name="theme-color" content="#0b0907" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="AstraStore — Distributed object storage" />
    <meta
      property="og:description"
      content="Chunked writes, checksum-verified reads, self-healing replication, and a live view of every node in the cluster."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Applies the stored theme before first paint so there is no flash of the
      wrong palette. A separate file rather than an inline script so the
      production CSP can stay at `script-src 'self'`.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        AstraStore requires JavaScript to run. Please enable it and reload this page.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
