# ============================================================
#  AstraStore Dashboard — nginx site config
#
#  Two jobs:
#    1. Serve the single-page app (deep links fall back to /).
#    2. Reverse-proxy /api to the API Gateway so the browser
#       sees one origin and no CORS is needed.
#
#  The dashboard talks to NOTHING else. Cluster health, service
#  uptime and metrics all arrive through the gateway, so no
#  internal service is reachable from a browser.
# ============================================================

# Resolved over the compose network's DNS name. Kept as a literal
# rather than an env template so the image needs no entrypoint
# rewriting and can run as an unprivileged user.
upstream api_gateway {
    server api-gateway:8080;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never advertise the server version.
    server_tokens off;

    # ---- Security headers ----------------------------------
    # The bundle is fully self-hosted, so the policy can stay tight.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Uploads stream through this proxy; do not cap them at nginx's 1 MB default.
    client_max_body_size 0;

    # ---- Container healthcheck -----------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- API ------------------------------------------------
    location /api/ {
        proxy_pass         http://api_gateway;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Object uploads and downloads are streamed, not buffered,
        # so a large file never lands on this container's disk.
        proxy_request_buffering off;
        proxy_buffering         off;

        # Generous timeouts for large transfers.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Upstream error pages are JSON from the gateway; pass them
        # through untouched so the client can render a real message
        # instead of nginx's default HTML error body.
        proxy_intercept_errors off;
    }

    # ---- Static assets --------------------------------------
    # Vite emits content-hashed filenames, so these are immutable.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback ---------------------------------------
    # index.html must never be cached, or users get a stale shell
    # pointing at asset hashes that no longer exist after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }
}
