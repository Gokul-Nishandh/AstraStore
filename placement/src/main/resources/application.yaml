# ============================================================
#  Placement Service — Configuration
# ============================================================
spring:
  application:
    name: placement-service

  # Kafka consumer + producer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: placement-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

server:
  port: 8085

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

# OTEL / Jaeger
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  service:
    name: ${OTEL_SERVICE_NAME:placement-service}

logging:
  level:
    com.astrastore: DEBUG
    org.springframework.kafka: INFO

# ============================================================
#  AstraStore Cluster — Node Registry
#  All known storage nodes that the HeartbeatService polls.
#  Override via environment variables for Docker deployments.
# ============================================================
astrastore:
  cluster:
    nodes:
      - id: storage-node-1
        url: ${STORAGE_NODE_1_URL:http://storage-node-1:8088}
      - id: storage-node-2
        url: ${STORAGE_NODE_2_URL:http://storage-node-2:8088}
      - id: storage-node-3
        url: ${STORAGE_NODE_3_URL:http://storage-node-3:8088}
    heartbeat:
      # How often to poll each node (ms)
      interval-ms: 10000
      # HTTP connect + read timeout per heartbeat call (ms)
      timeout-ms: 5000
      # Consecutive failures before DEGRADED → DOWN transition
      failure-threshold: 3
      # Consecutive successes while RECOVERING before → HEALTHY
      recovery-threshold: 2
