// ============================================================
//  placement — Storage node placement / allocation service
//
//  Responsibilities:
//    - Decide which storage node should hold a new file
//    - Consume Kafka events from upload service
//    - Produce placement decisions to Kafka
// ============================================================
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'AstraStore Placement Service'

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2023.0.3')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Shared contracts (PlacementStrategy interface, ChunkManifest, etc.)
    implementation project(':astrastore-shared')

    // Kafka consumer + producer
    implementation 'org.springframework.kafka:spring-kafka'

    // Micrometer → OpenTelemetry tracing bridge
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'

    // Micrometer Prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Lombok — reduces boilerplate (Getter, Builder, @Slf4j, etc.)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

bootRun {
    args = ['--spring.profiles.active=local']
}
