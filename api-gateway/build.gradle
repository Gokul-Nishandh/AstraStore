// ============================================================
//  api-gateway — Spring Cloud Gateway (reactive / WebFlux)
//
//  Port: 8080
//  Routes all /api/** traffic to downstream microservices.
//
//  NOTE: Spring Cloud Gateway is built on WebFlux (reactive).
//        Do NOT add spring-boot-starter-web (servlet) here —
//        the two stacks conflict on the same classpath.
// ============================================================
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'AstraStore API Gateway'

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2023.0.3')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Spring Cloud Gateway — reactive, do NOT add spring-boot-starter-web
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Micrometer Prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Micrometer → OpenTelemetry tracing bridge (OTEL Java agent handles the rest)
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

bootRun {
    args = ['--spring.profiles.active=local']
}
