spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Auth — routed by Docker Compose DNS name inside the astrastore network
        - id: auth-route
          uri: http://auth:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        # Upload
        - id: upload-route
          uri: http://upload:8082
          predicates:
            - Path=/api/upload/**
          filters:
            - StripPrefix=1
        # Download
        - id: download-route
          uri: http://download:8083
          predicates:
            - Path=/api/download/**
          filters:
            - StripPrefix=1
        # Metadata
        - id: metadata-route
          uri: http://metadata:8084
          predicates:
            - Path=/api/metadata/**
          filters:
            - StripPrefix=1
        # Placement
        - id: placement-route
          uri: http://placement:8085
          predicates:
            - Path=/api/placement/**
          filters:
            - StripPrefix=1
        # Replication
        - id: replication-route
          uri: http://replication:8086
          predicates:
            - Path=/api/replication/**
          filters:
            - StripPrefix=1
        # Monitoring
        - id: monitoring-route
          uri: http://monitoring:8087
          predicates:
            - Path=/api/monitoring/**
          filters:
            - StripPrefix=1

      # Enable HTTP request metrics for Prometheus
      metrics:
        enabled: true

      # Global CORS — allow Grafana / Jaeger UI to query actuator endpoints
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

# OTEL / Jaeger
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4317}
  service:
    name: ${OTEL_SERVICE_NAME:api-gateway}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route: INFO
