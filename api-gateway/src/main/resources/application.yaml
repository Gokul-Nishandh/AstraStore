spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: upload-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/upload/**
        - id: download-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/download/**
        - id: metadata-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/metadata/**
        - id: placement-route
          uri: http://localhost:8085
          predicates:
            - Path=/api/placement/**
        - id: replication-route
          uri: http://localhost:8086
          predicates:
            - Path=/api/replication/**
        - id: monitoring-route
          uri: http://localhost:8087
          predicates:
            - Path=/api/monitoring/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
