# ============================================================
#  AstraStore — docker-compose
#  Full local development stack:
#    - 8 Spring Boot microservices
#    - 3 Storage Node agents (chunk storage)
#    - PostgreSQL (metadata + auth persistence)
#    - Redis (session / cache)
#    - Apache Kafka in KRaft mode (no Zookeeper) (async event bus)
#    - Prometheus (metrics)
#    - Grafana (dashboards)
#    - Jaeger (distributed tracing)
# ============================================================
services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: astrastore-postgres
    environment:
      POSTGRES_DB: astrastore
      POSTGRES_USER: astrastore
      POSTGRES_PASSWORD: astrastore_secret
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrastore -d astrastore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astrastore

  redis:
    image: redis:7-alpine
    container_name: astrastore-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astrastore

  kafka:
    image: apache/kafka:3.7.0
    container_name: astrastore-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CLUSTER_ID: 7Wm4eq2cRC2oEzD8sASzXA
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - astrastore

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: astrastore-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - astrastore

  grafana:
    image: grafana/grafana:10.4.0
    container_name: astrastore-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - astrastore

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: astrastore-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    networks:
      - astrastore

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    container_name: astrastore-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      # The edge rate limiters are Redis-backed. Without this the gateway
      # falls back to localhost, every rate-limited route fails closed, and
      # registration and login answer 503 while the services behind them are
      # perfectly healthy.
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_METRICS_EXPORTER: none
    depends_on:
      auth:
        condition: service_started
      monitoring:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - astrastore

  auth:
    build:
      context: .
      args:
        SERVICE: auth
    container_name: astrastore-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: auth-service
      # Presented by the gateway when it asks this service to resolve an API
      # key to an identity. Same value as every other service.
      ASTRA_INTERNAL_TOKEN: ${ASTRA_INTERNAL_TOKEN:-dev-only-not-for-production}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/astrastore
      SPRING_DATASOURCE_USERNAME: astrastore
      SPRING_DATASOURCE_PASSWORD: astrastore_secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_METRICS_EXPORTER: none
      # Signing key for access tokens. Overridden per-environment; the
      # default here exists only so `docker compose up` works out of the box
      # on a laptop and must never be used for a real deployment.
      JWT_SECRET: ${JWT_SECRET:-astrastore_jwt_secret_key_change_in_production_min_256_bits}
      # Comma-separated emails promoted to ADMIN on startup. Bootstraps the
      # first administrator, since registration always creates a plain USER.
      ASTRASTORE_ADMIN_EMAILS: ${ASTRASTORE_ADMIN_EMAILS:-suryapranav55@gmail.com}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - astrastore

  upload:
    build:
      context: .
      args:
        SERVICE: upload
    container_name: astrastore-upload
    ports:
      - "8082:8082"
    environment:
      ASTRA_INTERNAL_TOKEN: ${ASTRA_INTERNAL_TOKEN:-dev-only-not-for-production}
      SPRING_APPLICATION_NAME: upload-service
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      OTEL_SERVICE_NAME: upload-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_METRICS_EXPORTER: none
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICES_METADATA_URL: http://metadata:8084
      SERVICES_PLACEMENT_URL: http://placement:8085
    depends_on:
      kafka:
        condition: service_healthy
      metadata:
        condition: service_started
    networks:
      - astrastore


  download:
    build:
      context: .
      args:
        SERVICE: download
    container_name: astrastore-download
    ports:
      - "8083:8083"
    environment:
      ASTRA_INTERNAL_TOKEN: ${ASTRA_INTERNAL_TOKEN:-dev-only-not-for-production}
      SPRING_APPLICATION_NAME: download-service
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      OTEL_SERVICE_NAME: download-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_METRICS_EXPORTER: none
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICES_METADATA_URL: http://metadata:8084
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - astrastore

  metadata:
    build:
      context: .
      args:
        SERVICE: metadata
    container_name: astrastore-metadata
    ports:
      - "8084:8084"
    environment:
      ASTRA_INTERNAL_TOKEN: ${ASTRA_INTERNAL_TOKEN:-dev-only-not-for-production}
      SPRING_APPLICATION_NAME: metadata-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/astrastore
      SPRING_DATASOURCE_USERNAME: astrastore
      SPRING_DATASOURCE_PASSWORD: astrastore_secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      OTEL_SERVICE_NAME: metadata-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_METRICS_EXPORTER: none
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - astrastore

  placement:
    build:
      context: .
      args:
        SERVICE: placement
    container_name: astrastore-placement
    ports:
      - "8085:8085"
    environment:
      SPRING_APPLICATION_NAME: placement-service
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      OTEL_SERVICE_NAME: placement-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_METRICS_EXPORTER: none
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - astrastore

  replication:
    build:
      context: .
      args:
        SERVICE: replication
    container_name: astrastore-replication
    ports:
      - "8086:8086"
    environment:
      ASTRA_INTERNAL_TOKEN: ${ASTRA_INTERNAL_TOKEN:-dev-only-not-for-production}
      SPRING_APPLICATION_NAME: replication-service
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      OTEL_SERVICE_NAME: replication-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_METRICS_EXPORTER: none
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICES_METADATA_URL: http://metadata:8084
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - astrastore

  monitoring:
    build:
      context: .
      args:
        SERVICE: monitoring
    container_name: astrastore-monitoring
    ports:
      - "8087:8087"
    environment:
      SPRING_APPLICATION_NAME: monitoring-service
      # Monitoring persists probe samples and incidents, so it needs the same
      # database the other services use. Without these it silently falls back
      # to localhost and dies at startup on a refused connection.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/astrastore
      SPRING_DATASOURCE_USERNAME: astrastore
      SPRING_DATASOURCE_PASSWORD: astrastore_secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      OTEL_SERVICE_NAME: monitoring-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_METRICS_EXPORTER: none
      # Placement owns the storage-node registry and heartbeat loop;
      # monitoring reads cluster state from it rather than duplicating it.
      SERVICES_PLACEMENT_URL: http://placement:8085
      # Probe targets for the availability tracker. Each entry is
      # id|display name|base URL; monitoring polls their actuator health.
      ASTRASTORE_MONITORING_TARGETS: >-
        gateway|API Gateway|http://api-gateway:8080,
        auth|Authentication|http://auth:8081,
        upload|Upload|http://upload:8082,
        download|Download|http://download:8083,
        metadata|Metadata|http://metadata:8084,
        placement|Placement|http://placement:8085,
        replication|Replication|http://replication:8086,
        storage-node-1|Storage Node 1|http://storage-node-1:8088,
        storage-node-2|Storage Node 2|http://storage-node-2:8088,
        storage-node-3|Storage Node 3|http://storage-node-3:8088
      ASTRASTORE_MONITORING_PROBE_INTERVAL_MS: "10000"
    depends_on:
      - placement
    networks:
      - astrastore

  # ---------------------------------------------------------------------------
  # Dashboard (React SPA served by nginx)
  # ---------------------------------------------------------------------------
  # The only service a browser talks to. nginx serves the bundle and
  # reverse-proxies /api to the gateway, so no internal service needs to
  # be exposed to the host and there is no cross-origin traffic.

  dashboard:
    build:
      context: ./dashboard
    container_name: astrastore-dashboard
    ports:
      - "5173:8080"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - astrastore

  # ---------------------------------------------------------------------------
  # Storage Nodes (chunk storage agents)
  # ---------------------------------------------------------------------------
  # NOTE: Storage nodes are internal-only (not exposed via API Gateway).
  # They are accessed directly by Upload, Download, and Replication services
  # via Docker DNS (e.g., http://storage-node-1:8088).
  # Storage nodes are stateless and do NOT depend on postgres/redis.

  storage-node-1:
    build:
      context: .
      args:
        SERVICE: storage-node
    container_name: astrastore-storage-node-1
    ports:
      - "8088:8088"
    environment:
      # Each node reports against its own configured quota and the bytes it
      # has actually stored. Without this it would report the host filesystem,
      # so three nodes on one laptop would triple-count the same physical disk.
      STORAGE_NODE_ID: storage-node-1
      STORAGE_CAPACITY_BYTES: ${STORAGE_NODE_CAPACITY_BYTES:-21474836480}
    volumes:
      - storage-node-1-data:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - astrastore

  storage-node-2:
    build:
      context: .
      args:
        SERVICE: storage-node
    container_name: astrastore-storage-node-2
    ports:
      - "8089:8088"
    environment:
      STORAGE_NODE_ID: storage-node-2
      STORAGE_CAPACITY_BYTES: ${STORAGE_NODE_CAPACITY_BYTES:-21474836480}
    volumes:
      - storage-node-2-data:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - astrastore

  storage-node-3:
    build:
      context: .
      args:
        SERVICE: storage-node
    container_name: astrastore-storage-node-3
    ports:
      - "8090:8088"
    environment:
      STORAGE_NODE_ID: storage-node-3
      STORAGE_CAPACITY_BYTES: ${STORAGE_NODE_CAPACITY_BYTES:-21474836480}
    volumes:
      - storage-node-3-data:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - astrastore

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  astrastore:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes (persist data across `docker compose down`)
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  storage-node-1-data:
  storage-node-2-data:
  storage-node-3-data:
