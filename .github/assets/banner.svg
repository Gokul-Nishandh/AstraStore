<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 200" width="1120" height="200" role="img" aria-label="AstraStore — a distributed object store built from scratch: chunked, replicated and self-healing.">
  <defs>
    <radialGradient id="wash" cx="18%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#D9915E" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#D9915E" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#D9915E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1120" height="200" rx="14" fill="#191712"/>
  <rect x="0" y="0" width="1120" height="200" rx="14" fill="url(#wash)"/>

  <text x="60" y="86" font-family="'Space Grotesk','Segoe UI',Inter,system-ui,sans-serif" font-size="42" font-weight="700" fill="#F5F2EC" letter-spacing="-0.8">AstraStore</text>
  <text x="60" y="118" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="15" fill="#C9C4BB">A distributed object store built from scratch — chunked, replicated, self-healing.</text>

  <g font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="11.5" fill="#8A857B">
    <text x="60" y="150">Java 21</text>
    <text x="128" y="150">·</text>
    <text x="142" y="150">Spring Boot</text>
    <text x="222" y="150">·</text>
    <text x="236" y="150">Kafka</text>
    <text x="280" y="150">·</text>
    <text x="294" y="150">PostgreSQL</text>
    <text x="374" y="150">·</text>
    <text x="388" y="150">React</text>
    <text x="430" y="150">·</text>
    <text x="444" y="150">Docker</text>
  </g>

  <!-- motif: three nodes, each holding one primary and one replica -->
  <g>
    <rect x="872" y="52" width="52" height="18" rx="4" fill="#D9915E" fill-opacity="0.85"/>
    <rect x="872" y="78" width="52" height="18" rx="4" fill="#3FBB84" fill-opacity="0.7"/>
    <rect x="872" y="104" width="52" height="18" rx="4" fill="#2C2922"/>
    <text x="898" y="142" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="9.5" fill="#6E695F">node 1</text>

    <rect x="940" y="52" width="52" height="18" rx="4" fill="#3FBB84" fill-opacity="0.7"/>
    <rect x="940" y="78" width="52" height="18" rx="4" fill="#D9915E" fill-opacity="0.85"/>
    <rect x="940" y="104" width="52" height="18" rx="4" fill="#2C2922"/>
    <text x="966" y="142" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="9.5" fill="#6E695F">node 2</text>

    <rect x="1008" y="52" width="52" height="18" rx="4" fill="#2C2922"/>
    <rect x="1008" y="78" width="52" height="18" rx="4" fill="#3FBB84" fill-opacity="0.7"/>
    <rect x="1008" y="104" width="52" height="18" rx="4" fill="#D9915E" fill-opacity="0.85"/>
    <text x="1034" y="142" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="9.5" fill="#6E695F">node 3</text>
  </g>
</svg>
