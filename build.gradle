// ============================================================
//  AstraStore — Root build.gradle
//  Manages all 8 Spring Boot microservices as a Gradle
//  multi-project build, plus shared dependency versions.
// ============================================================

plugins {
    id 'org.springframework.boot'        version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

// Shared dependency management
ext {
    set('springCloudVersion', '2023.0.3')
}

allprojects {
    group = 'com.astrastore'
    version = '1.0.0'

    repositories {
        mavenCentral()
        // Required for opentelemetry-java-instrumentation extensions used by micrometer-tracing
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

subprojects {
    apply plugin: 'java'
    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    tasks.withType(Test) {
        useJUnitPlatform()
    }
}

// Custom task: boot all services in parallel
task runAll {
    group       = 'application'
    description = 'Boot all 8 AstraStore microservices in parallel'

    def bootRunTasks = subprojects
            .collect { p -> p.tasks.findByName('bootRun') }
            .findAll { it != null }

    dependsOn bootRunTasks
}
